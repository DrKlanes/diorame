<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>SVG diff</title>
	<style>
		body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
		table { border-collapse: collapse; margin: 12px 0; }
		th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
		tr.bad td { background: #ffe3e3; }
		tr.ok td { background: #e8f7e8; }
		/* live <text> fallback words: expected, counted apart (an SVG loaded as an image has no web fonts) */
		tr.live td { background: #fff3d6; }
		#images { display: flex; flex-wrap: wrap; gap: 12px; }
		figure { margin: 0; }
		figure img { width: 320px; border: 1px solid #ccc; }
	</style>
</head>
<body>
	<h1>Fidelidad SVG ↔ Canvas</h1>
	<p>Referencia: renderFrame (pipeline del PNG HQ). Candidato: exportAsSVG rasterizado por el navegador.
		Diff: rojo = tinta solo en SVG, azul = tinta solo en Canvas.</p>
	<p><label>Escena real (.dior): <input id="dior" type="file" accept=".dior,.json" /></label> <span id="status"></span></p>
	<div id="out"></div>
	<div id="images"></div>
	<script type="module" src="./main.ts"></script>
</body>
</html>
